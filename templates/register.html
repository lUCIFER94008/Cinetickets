{% extends 'base.html' %}

{% block title %}Create Account - CineTickets{% endblock %}

{% block content %}
<div class="auth-container">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i class="fa-solid fa-film" style="font-size: 2.5rem; color: var(--primary-red); margin-bottom: 0.5rem;"></i>
        <h2 style="font-size: 1.75rem; font-weight: 800;">Create Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join CineTickets for seamless movie booking</p>
    </div>

    <form action="{{ url_for('auth_bp.register_page') }}" method="POST">
        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="user@cinetickets.com" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">Register Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="{{ url_for('auth_bp.login_page') }}" style="color: var(--primary-red); font-weight: 600;">Sign In</a>
    </div>
</div>
{% endblock %}
