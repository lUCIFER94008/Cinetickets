{% extends 'base.html' %}

{% block title %}Sign In - CineTickets{% endblock %}

{% block content %}
<div class="auth-container">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i class="fa-solid fa-film" style="font-size: 2.5rem; color: var(--primary-red); margin-bottom: 0.5rem;"></i>
        <h2 style="font-size: 1.75rem; font-weight: 800;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Log in to manage your movie tickets and bookings</p>
    </div>

    <form action="{{ url_for('auth_bp.login_page') }}" method="POST">
        <input type="hidden" name="next" value="{{ next_url or request.args.get('next', '') }}">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="user@cinetickets.com" required autocomplete="email">
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">Sign In</button>
    </form>


    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="{{ url_for('auth_bp.register_page') }}" style="color: var(--primary-red); font-weight: 600;">Register Now</a>
    </div>
</div>
{% endblock %}
